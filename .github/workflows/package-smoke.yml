name: Windows Packaging Smoke

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'deployment/**'
      - 'scripts/build-smoke.ps1'
      - 'pyproject.toml'
      - '.github/workflows/package-smoke.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'deployment/**'
      - 'scripts/build-smoke.ps1'
      - 'pyproject.toml'
      - '.github/workflows/package-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaging-smoke:
    name: Windows packaging smoke
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install packaging dependencies
        run: python -m pip install '.[package]'
      - name: Build packaged application smoke target
        shell: pwsh
        run: ./scripts/build-smoke.ps1
