name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install project and development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check critical Python errors
        if: runner.os == 'Linux'
        run: python -m ruff check --select E9,F63,F7,F82 src tests
      - name: Run tests with coverage floor
        if: runner.os == 'Linux'
        run: python -m pytest --cov=matter_context --cov-report=term-missing --cov-fail-under=80
      - name: Run tests
        if: runner.os == 'Windows'
        run: python -m pytest
      - name: Run application smoke test
        run: python -m matter_context --smoke-test
