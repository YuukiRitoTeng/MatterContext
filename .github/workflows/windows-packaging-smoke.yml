name: Windows packaging smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "!src/**/*.md"
      - "deployment/**"
      - "scripts/build-smoke.ps1"
      - "pyproject.toml"
      - ".github/workflows/windows-packaging-smoke.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "!src/**/*.md"
      - "deployment/**"
      - "scripts/build-smoke.ps1"
      - "pyproject.toml"
      - ".github/workflows/windows-packaging-smoke.yml"

permissions:
  contents: read

concurrency:
  group: packaging-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaging-smoke:
    name: Windows packaging smoke
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install packaging dependencies
        run: python -m pip install '.[package]'
      - name: Build packaged application smoke target
        shell: pwsh
        run: ./scripts/build-smoke.ps1
